<div class="control rv-input-surface" [class.invalid]="invalid()">
  <input
    #editor
    [type]="revealed() ? 'text' : 'password'"
    [id]="controlId()"
    [name]="name()"
    [autocomplete]="autocomplete()"
    [value]="value()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.aria-describedby]="describedBy() || null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    (input)="value.set(editor.value)"
    (keydown)="trackCapsLock($event)"
    (keyup)="trackCapsLock($event)"
    (blur)="capsLock.set(false)"
  />
  <button
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="revealed()"
    (click)="revealed.update(toggle)"
  >
    @if (icon(); as custom) {
      <ng-container
        [ngTemplateOutlet]="custom"
        [ngTemplateOutletContext]="{ $implicit: revealed() }"
      />
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
        <circle cx="12" cy="12" r="2.5" />
        @if (revealed()) {
          <path d="m4 4 16 16" />
        }
      </svg>
    }
  </button>
</div>


@if (showCapsLock() && capsLock()) {
  <p class="password-feedback" role="status">{{ capsLockLabel() }}</p>
}
@if (strengthLevel() !== null) {
  <div class="strength">
    <meter min="0" max="4" [value]="strengthLevel() ?? 0" [attr.aria-label]="strengthLabel()"
      [attr.aria-valuetext]="strengthText() || null"></meter>
    @if (strengthText()) { <span>{{ strengthText() }}</span> }
  </div>
}
