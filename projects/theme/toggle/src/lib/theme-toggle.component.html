@if (presentation() === 'single') {
  <button
    class="control single"
    type="button"
    [attr.aria-label]="singleAccessibleLabel()"
    [disabled]="availableModes().length === 0"
    (click)="advance($event)"
  >
    <span class="icon-content" aria-hidden="true">
      @if (iconTemplate(controller.mode()); as customIcon) {
        <ng-container [ngTemplateOutlet]="customIcon" />
      } @else {
        @switch (controller.mode()) {
          @case ('light') {
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
              />
            </svg>
          }
          @case ('dark') {
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M20.2 15.7A8.5 8.5 0 0 1 8.3 3.8 8.6 8.6 0 1 0 20.2 15.7Z" />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M8 21h8m-4-4v4" />
            </svg>
          }
        }
      }
    </span>
    <span class="visible-label">{{ labels()[controller.mode()] }}</span>
  </button>
} @else {
  <div
    class="control-group"
    role="radiogroup"
    [attr.aria-label]="labels().groupLabel"
    (keydown)="onRadioKeydown($event)"
  >
    @for (mode of availableModes(); track mode) {
      <button
        class="control option"
        type="button"
        role="radio"
        [attr.data-rv-mode]="mode"
        [attr.aria-checked]="controller.mode() === mode"
        [attr.aria-label]="labels()[mode]"
        [tabIndex]="radioTabStop() === mode ? 0 : -1"
        (click)="selectMode(mode, $event)"
      >
        <span class="icon-content" aria-hidden="true">
          @if (iconTemplate(mode); as customIcon) {
            <ng-container [ngTemplateOutlet]="customIcon" />
          } @else {
            @switch (mode) {
              @case ('light') {
                <svg viewBox="0 0 24 24" focusable="false">
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
                  />
                </svg>
              }
              @case ('dark') {
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M20.2 15.7A8.5 8.5 0 0 1 8.3 3.8 8.6 8.6 0 1 0 20.2 15.7Z" />
                </svg>
              }
              @default {
                <svg viewBox="0 0 24 24" focusable="false">
                  <rect x="3" y="4" width="18" height="13" rx="2" />
                  <path d="M8 21h8m-4-4v4" />
                </svg>
              }
            }
          }
        </span>
        <span class="visible-label">{{ labels()[mode] }}</span>
      </button>
    }
  </div>
  @if (availableModes().length === 0) {
    <span class="visually-hidden" role="status">{{ labels().noModesAvailable }}</span>
  }
}
