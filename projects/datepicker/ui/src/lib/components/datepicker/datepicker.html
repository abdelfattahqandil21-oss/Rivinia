<span #field class="rv-datepicker-field">
  <svg class="rv-datepicker-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <rect
      x="2.5"
      y="3.5"
      width="11"
      height="10"
      rx="1.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.25"
    />
    <path
      d="M2.5 6.5h11M5.5 2v3M10.5 2v3"
      stroke="currentColor"
      stroke-width="1.25"
      stroke-linecap="round"
    />
  </svg>
  <rv-date-segments
    [value]="normalized()"
    [locale]="effectiveLocale()"
    [format]="effectiveFormat()"
    [labels]="calendar.labels()"
    [label]="label() ?? calendar.labels().chooseDate"
    [disabled]="isDisabled()"
    [attr.aria-describedby]="formatHintId"
    (valueChange)="onTypedDate($event)"
  />
  <button
    #trigger
    type="button"
    class="rv-datepicker-trigger"
    [disabled]="isDisabled()"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-expanded]="open() ? 'true' : 'false'"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="triggerLabel()"
    (click)="toggle()"
  >
    <span class="rv-datepicker-value">{{ triggerText() }}</span>
    <svg class="rv-datepicker-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path
        d="m3.5 6 4.5 4.5L12.5 6"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</span>
<small [id]="formatHintId" class="rv-datepicker-format-hint">{{ formatHint() }}</small>

@if (open() || closing()) {
  <div
    #panel
    class="rv-datepicker-panel"
    [class.rv-datepicker-panel--closing]="closing()"
    role="dialog"
    [id]="panelId"
    [attr.aria-labelledby]="headingId"
    [attr.inert]="closing() || isDisabled() ? '' : null"
    [attr.aria-hidden]="closing() ? 'true' : null"
    [style.--rv-datepicker-panel-shift]="panelShift() + 'px'"
    (click)="onPanelClick($event)"
    (keydown)="onPanelKeydown($event)"
    (animationend)="onPanelAnimationEnd($event)"
  >
    <rv-calendar
      [calendar]="calendar"
      [headingId]="headingId"
      [autofocus]="true"
      (picked)="onPicked($event)"
      (dismissed)="dismiss()"
    >
      <div calendarEditor class="rv-datepicker-panel-editor">
        <rv-date-segments
          [value]="calendar.selected()"
          [locale]="effectiveLocale()"
          [format]="effectiveFormat()"
          [labels]="calendar.labels()"
          [label]="label() ?? calendar.labels().chooseDate"
          [disabled]="isDisabled()"
          (valueChange)="onTypedDate($event)"
        />
        <button
          type="button"
          class="rv-datepicker-action"
          [disabled]="!calendar.canSelect(calendar.today())"
          (click)="onPicked(calendar.today())"
        >{{ calendar.labels().today ?? 'Today' }}</button>
        @if (canClear()) {
          <button
            type="button"
            class="rv-datepicker-action rv-datepicker-clear-action"
            [attr.aria-label]="clearLabel()"
            [attr.data-tooltip]="calendar.labels().clearDate"
            (click)="clearValue()"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M2.75 4.25h10.5M6 4.25v-1.5h4v1.5m2.25 0-.6 9H4.35l-.6-9m3 2.25v4.5m3.5-4.5v4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.25"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        }
      </div>
    </rv-calendar>
    <div class="rv-datepicker-actions">
      @if (commitMode() === 'explicit' || pendingClear()) {
        <div class="rv-datepicker-actions-end">
          <button
            type="button"
            class="rv-datepicker-action rv-datepicker-cancel"
            (click)="dismiss()"
          >
            {{ calendar.labels().cancel ?? 'Cancel' }}
          </button>
          <button
            type="button"
            class="rv-datepicker-action rv-datepicker-ok"
            [disabled]="!canCommit()"
            (click)="commit()"
          >
            {{ calendar.labels().ok }}
          </button>
        </div>
      }
    </div>
  </div>
}
